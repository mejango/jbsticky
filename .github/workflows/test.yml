name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      network:
        description: Read-only fork rehearsal RPC alias
        type: choice
        default: ethereum_sepolia
        options: [ethereum, optimism, base, arbitrum, ethereum_sepolia, optimism_sepolia, base_sepolia, arbitrum_sepolia]
jobs:
  forge-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/JBSticky
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions/JBSticky
          submodules: recursive
      # These package.json file dependencies are intentional. Pin their sources
      # and reproduce the same sibling layout as the protocol workspace.
      - uses: actions/checkout@v4
        with:
          repository: Bananapus/nana-core-v6
          ref: 898f08b96194391d545df31a62f9d89ef6759f9a
          path: nana-core-v6
      - uses: actions/checkout@v4
        with:
          repository: Bananapus/nana-distributor-v6
          ref: 79af754e642b648347aba0c7df8a3398215e74a5
          path: nana-distributor-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: extensions/JBSticky/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Run tests
        run: forge test --fail-fast --summary --detailed
      - name: Check Sphinx configuration without public RPC calls
        run: node --test test/deployment/config.test.cjs
      - name: Check contract sizes
        run: forge build --sizes --skip "*/test/**" --skip "*/script/**" --skip SphinxUtils
      - name: Compile deployment entrypoints
        run: forge build --skip "*/test/**"
      - name: Rehearse deployment and restart on the selected chain
        if: github.event_name == 'workflow_dispatch'
        run: forge script script/Rehearse.s.sol:Rehearse --rpc-url "${{ inputs.network }}" -vv
        env:
          FOUNDRY_PROFILE: deploy
          RPC_ETHEREUM_MAINNET: ${{ secrets.RPC_ETHEREUM_MAINNET }}
          RPC_OPTIMISM_MAINNET: ${{ secrets.RPC_OPTIMISM_MAINNET }}
          RPC_BASE_MAINNET: ${{ secrets.RPC_BASE_MAINNET }}
          RPC_ARBITRUM_MAINNET: ${{ secrets.RPC_ARBITRUM_MAINNET }}
          RPC_ETHEREUM_SEPOLIA: ${{ secrets.RPC_ETHEREUM_SEPOLIA }}
          RPC_OPTIMISM_SEPOLIA: ${{ secrets.RPC_OPTIMISM_SEPOLIA }}
          RPC_BASE_SEPOLIA: ${{ secrets.RPC_BASE_SEPOLIA }}
          RPC_ARBITRUM_SEPOLIA: ${{ secrets.RPC_ARBITRUM_SEPOLIA }}
