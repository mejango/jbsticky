name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      network:
        description: Read-only fork rehearsal network or group
        type: choice
        default: ethereum_sepolia
        options: [testnets, mainnets, ethereum, optimism, base, arbitrum, ethereum_sepolia, optimism_sepolia, base_sepolia, arbitrum_sepolia]
jobs:
  forge-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/Sticky
    steps:
      - uses: actions/checkout@v4
        with:
          path: extensions/Sticky
          submodules: recursive
      # These package.json file dependencies are intentional. Pin their sources
      # and reproduce the same sibling layout as the protocol workspace.
      - uses: actions/checkout@v4
        with:
          repository: Bananapus/nana-core-v6
          ref: feff600654aee6fb1747dded692f18068b2230a6
          path: nana-core-v6
      - uses: actions/checkout@v4
        with:
          repository: Bananapus/nana-distributor-v6
          ref: 44d6d5d2e7cca77422ee0ac4909cf42ccf7839b5
          path: nana-distributor-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: extensions/Sticky/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Run tests
        run: forge test --deny notes --fail-fast --summary --detailed --skip "*/script/**"
      - name: Test real projects and Ethereum-to-Base rewards
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 30
        run: npm run test:fork
        env:
          RPC_ETHEREUM_MAINNET: ${{ secrets.RPC_ETHEREUM_MAINNET }}
          RPC_BASE_MAINNET: ${{ secrets.RPC_BASE_MAINNET }}
      - name: Check Sphinx configuration without public RPC calls
        run: node --test test/deployment/*.test.cjs test/deployment/*.test.mjs
      - name: Check runtime lint and contract sizes
        run: forge build --deny notes --sizes --skip "*/test/**" --skip "*/script/**" --skip SphinxUtils
      - name: Compile deployment entrypoints
        run: forge build --skip "*/test/**"
      - name: Rehearse deployment and restart on the selected chain
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$STICKY_NETWORK" in
            testnets|mainnets) sh script/deploy.sh rehearse "$STICKY_NETWORK" ;;
            *) forge script script/Rehearse.s.sol:Rehearse --rpc-url "$STICKY_NETWORK" -vv ;;
          esac
        env:
          STICKY_NETWORK: ${{ inputs.network }}
          STICKY_REVISION: ${{ github.sha }}
          FOUNDRY_PROFILE: deploy
          RPC_ETHEREUM_MAINNET: ${{ secrets.RPC_ETHEREUM_MAINNET }}
          RPC_OPTIMISM_MAINNET: ${{ secrets.RPC_OPTIMISM_MAINNET }}
          RPC_BASE_MAINNET: ${{ secrets.RPC_BASE_MAINNET }}
          RPC_ARBITRUM_MAINNET: ${{ secrets.RPC_ARBITRUM_MAINNET }}
          RPC_ETHEREUM_SEPOLIA: ${{ secrets.RPC_ETHEREUM_SEPOLIA }}
          RPC_OPTIMISM_SEPOLIA: ${{ secrets.RPC_OPTIMISM_SEPOLIA }}
          RPC_BASE_SEPOLIA: ${{ secrets.RPC_BASE_SEPOLIA }}
          RPC_ARBITRUM_SEPOLIA: ${{ secrets.RPC_ARBITRUM_SEPOLIA }}
